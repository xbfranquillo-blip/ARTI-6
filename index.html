<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTI 3 | Tutoría Médica IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 450px; text-align: center; border-top: 4px solid #4f46e5; }
        h1 { color: #4f46e5; margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #64748b; margin-bottom: 2rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background-color: #4f46e5; color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #4338ca; }
        #response { margin-top: 1.5rem; padding: 1rem; border-radius: 0.5rem; background-color: #f1f5f9; font-size: 0.9rem; min-height: 50px; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ARTI 3 🩺</h1>
        <p>Plataforma avanzada de tutoría médica</p>
        <input type="text" id="question" placeholder="Escribe tu duda médica aquí...">
        <button onclick="askAI()">Consultar Tutor</button>
        <div id="response">La respuesta del tutor aparecerá aquí...</div>
    </div>

    <script>
        async function askAI() {
            const question = document.getElementById('question').value;
            const resDiv = document.getElementById('response');
            if(!question) return;
            
            resDiv.innerText = "Analizando bases de datos médicas...";
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: question })
                });
                const data = await response.json();
                resDiv.innerText = data.reply || "Error en la respuesta de la IA.";
            } catch (err) {
                resDiv.innerText = "Error: El servidor no responde. Revisa la API Key en Vercel.";
            }
        }
    </script>
</body>
</html>
